<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UPL Univesity Chatbot</title>

<style>
body {
    margin: 0;
    background: #f0f2f5;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.chat-container {
    width: 380px;
    height: 550px;
    background: white;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.chat-header {
    background: linear-gradient(90deg, #7b5cff, #a855f7);
    color: white;
    padding: 15px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 10px;
}

.chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f7f7f7;
    display: flex;
    flex-direction: column;
}

.message {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 15px;
    margin-bottom: 10px;
    font-size: 14px;
    word-wrap: break-word;
}

.bot {
    background: #e5e7eb;
    align-self: flex-start;
}

.user {
    background: #7b5cff;
    color: white;
    align-self: flex-end;
}

/* Typing indicator */
.typing {
    background: #e5e7eb;
    align-self: flex-start;
    padding: 10px 16px;
    border-radius: 15px;
    margin-bottom: 10px;
    font-size: 20px;
    letter-spacing: 2px;
    color: #888;
}

.chat-input {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ddd;
}

.chat-input input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #f1f1f1;
    outline: none;
    font-size: 14px;
}

.chat-input button {
    margin-left: 10px;
    padding: 10px 15px;
    border: none;
    background: #7b5cff;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
}

.chat-input button:disabled {
    background: #bbb;
    cursor: not-allowed;
}

.quick-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.quick-buttons button {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #7b5cff;
    background: white;
    color: #7b5cff;
    cursor: pointer;
    font-size: 13px;
}

.quick-buttons button:hover {
    background: #7b5cff;
    color: white;
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        🤖 UPL University Chatbot
    </div>

    <div id="chatBox" class="chat-box"></div>

    <div class="chat-input">
        <input id="input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
const chatBox  = document.getElementById("chatBox");
const sendBtn  = document.getElementById("sendBtn");
const inputBox = document.getElementById("input");

// ── IMPORTANT: paste your localtunnel URL here ─────────────────
const API_URL = "http://127.0.0.1:8000/chat";
// ──────────────────────────────────────────────────────────────

window.onload = function() {
    addBotMessage("Hi 👋 Welcome to UPL University!");
    addBotMessage("How can I help you today?");
    addQuickButtons(["Admission", "Courses", "Hostel", "Placement"]);
};

function addBotMessage(text) {
    const div = document.createElement("div");
    div.className = "message bot";
    div.textContent = text;
    chatBox.appendChild(div);
    scrollDown();
}

function addUserMessage(text) {
    const div = document.createElement("div");
    div.className = "message user";
    div.textContent = text;
    chatBox.appendChild(div);
    scrollDown();
}

function showTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typing";
    div.textContent = "• • •";
    chatBox.appendChild(div);
    scrollDown();
}

function hideTyping() {
    const el = document.getElementById("typing");
    if (el) el.remove();
}

function addQuickButtons(options) {
    const wrapper = document.createElement("div");
    wrapper.className = "quick-buttons";
    options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => sendMessage(opt);
        wrapper.appendChild(btn);
    });
    chatBox.appendChild(wrapper);
    scrollDown();
}

function quickReply(text) {
    sendMessage(text);
}

async function sendMessage(customText = null) {
    const message = customText || inputBox.value.trim();
    if (!message) return;

    addUserMessage(message);
    inputBox.value = "";

    // Disable input while waiting
    sendBtn.disabled = true;
    inputBox.disabled = true;
    showTyping();

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: message })
        });

        const data = await res.json();
        hideTyping();
        addBotMessage(data.answer);

    } catch (err) {
        hideTyping();
        addBotMessage("⚠️ Server not reachable. Please try again.");
    }

    // Re-enable input
    sendBtn.disabled = false;
    inputBox.disabled = false;
    inputBox.focus();
}

function scrollDown() {
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
